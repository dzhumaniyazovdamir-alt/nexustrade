<section class="auth-page">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Создание рабочего пространства</mat-card-title>
      <mat-card-subtitle>Вы станете владельцем новой организации</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>Ваше имя</mat-label>
          <input matInput formControlName="displayName" autocomplete="name" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Организация</mat-label>
          <input matInput formControlName="organizationName" autocomplete="organization" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Пароль</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint>Не менее 12 символов, верхний и нижний регистр, цифра</mat-hint>
        </mat-form-field>
        @if (error(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Создаём…' : 'Создать аккаунт' }}
        </button>
      </form>
      <p>Уже зарегистрированы? <a routerLink="/login">Войти</a></p>
    </mat-card-content>
  </mat-card>
</section>
