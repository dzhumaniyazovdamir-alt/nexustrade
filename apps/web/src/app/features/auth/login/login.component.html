<section class="auth-page">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Вход в NexusTrade</mat-card-title>
      <mat-card-subtitle>Используйте рабочую учётную запись</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Пароль</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>
        @if (error(); as message) {
          <p class="form-error" role="alert">{{ message }}</p>
        }
        <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Входим…' : 'Войти' }}
        </button>
      </form>
      <p>Нет аккаунта? <a routerLink="/register">Создать организацию</a></p>
    </mat-card-content>
  </mat-card>
</section>
