<mat-card appearance="outlined">
  <mat-card-header><mat-card-title>Приглашение в организацию</mat-card-title></mat-card-header>
  <mat-card-content>
    <p [attr.role]="status() === 'error' ? 'alert' : 'status'">{{ message() }}</p>
    @if (status() !== 'loading') {
      <a mat-flat-button routerLink="/organizations">К организациям</a>
    }
  </mat-card-content>
</mat-card>
